name: iOS migration contracts

on:
  push:
    paths:
      - 'migbot/**'
      - 'fixtures/**'
      - 'tests/**'
      - '.github/workflows/ios-contracts.yml'
  pull_request:
    paths:
      - 'migbot/**'
      - 'fixtures/**'
      - 'tests/**'
      - '.github/workflows/ios-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contracts:
    name: static contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Ensure native search dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update -qq && sudo apt-get install -y ripgrep ;;
              macOS) brew install ripgrep ;;
              Windows) choco install ripgrep --no-progress -y ;;
              *) exit 1 ;;
            esac
          fi
          rg --version

      - name: Install contract test dependencies
        run: python -m pip install pytest Pillow ImageHash

      - name: Install preserved regression test dependency
        run: python -m pip install pytest==8.3.5 packaging==24.2 pluggy==1.5.0 iniconfig==2.0.0

      - name: Run preserved routing and cumulative-budget contracts
        if: runner.os != 'Windows'
        run: |
          python migbot/scripts/test_execution_policy.py -v
          python migbot/scripts/test_execution_install.py -v

      - name: Reopen original online G0 after modal-visual upgrade
        if: runner.os != 'Windows'
        run: python migbot/scripts/test_modal_visual_upgrade.py -v

      - name: Run offline iOS E2E fixture
        run: python tests/test_e2e_i2h_fixture.py -v

      - name: Run preserved Plan/UI coverage regression
        run: python tests/test_plan_ui_coverage.py -v

      - name: Run marker schema and hash tests
        run: python -m unittest tests/test_marker_contract.py -v

      - name: Verify installed Python gates and upgrade contracts
        run: python -m unittest migbot.scripts.test_install_runtime -v

      - name: Run i2h-execute contract tests
        run: python -m pytest -q migbot/skills/i2h-execute/scripts/tests

      - name: Run spec and plan contract tests
        run: |
          python -m pytest -q migbot/skills/i2h-spec/scripts/tests
          python -m pytest -q migbot/skills/i2h-plan/scripts/tests

      - name: Run native Verify contract tests
        run: python -m pytest -q migbot/skills/i2h-verify/scripts/tests

      - name: Run preserved source and authority function-style tests
        # These online pytest tests are not collected by unittest discover.
        run: |
          python -m pytest -q migbot/skills/i2h-spec/scripts/tests/test_declaration_scoping.py migbot/skills/i2h-spec/scripts/tests/test_resource_fidelity.py migbot/skills/i2h-spec/scripts/tests/test_native_skeleton_consumers.py
          python -m pytest -q migbot/skills/i2h-plan/scripts/tests/test_feat_glob_fix.py migbot/skills/i2h-plan/scripts/tests/test_ui_delivery_host_validation.py migbot/skills/i2h-plan/scripts/tests/test_plan_dependency_checks.py
          python -m pytest -q migbot/skills/i2h-execute/scripts/tests/test_authority_strict.py migbot/skills/i2h-execute/scripts/tests/test_current_authority_chain.py migbot/skills/i2h-execute/scripts/tests/test_indentation_defect.py

      - name: Run modal foreground/capture regressions
        run: python -m unittest discover -s migbot/skills/i2h-verify/scripts/tests -p "test_modal_visual_*.py" -v

      - name: Compile Python sources
        shell: bash
        run: |
          for dir in \
            migbot/skills/i2h-spec/scripts \
            migbot/skills/i2h-plan/scripts \
            migbot/skills/i2h-execute/scripts \
            migbot/skills/i2h-verify/scripts \
            migbot/skills/i2h-retrospect/scripts; do
            if [ -d "$dir" ]; then python -m compileall -q "$dir"; fi
          done

  plugin-manifests:
    name: Claude plugin manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('.claude-plugin/marketplace.json'),
              Path('migbot/.claude-plugin/plugin.json'),
              Path('legacy-android/.claude-plugin/plugin.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
      - name: Verify plugin CLI when available
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate migbot --profile directory --strict
            claude plugin validate legacy-android --profile directory --strict
            claude plugin validate .
          else
            echo 'Claude Code CLI is not installed on this runner; JSON and fixture checks remain authoritative.'
          fi
