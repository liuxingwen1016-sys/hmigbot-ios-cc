## Analysis Guidelines

### File Reading Strategy

1. **Start with core files** (priority order):
   - `Info.plist` — App metadata
   - `AppDelegate.swift` / `SceneDelegate.swift` — App lifecycle
   - Main ViewControllers — UI structure
   - Models — Data entities
   - ViewModels — Business logic

2. **For large projects** (>500 files):
   - Analyze by module (Views → ViewModels → Models → Services)
   - Don't read all files at once (memory limit)
   - Write each section immediately after analyzing relevant files

3. **Use Grep for patterns**:
   - Enums: `grep -r "enum " --include="*.swift"`
   - ViewModels: `grep -r "ObservableObject" --include="*.swift"`
   - Network calls: `grep -r "URLSession\|Alamofire" --include="*.swift"`
   - Persistence: `grep -r "UserDefaults\|Core Data\|@AppStorage" --include="*.swift"`

### Entity Detection

**Models**:
```bash
grep -r "struct.*Codable\|class.*Codable\|@Entity" --include="*.swift"
```

**Enums**:
```bash
grep -r "enum " --include="*.swift" | grep -v "// "
```

**Protocols**:
```bash
grep -r "protocol " --include="*.swift"
```

### Navigation Detection

**UIKit**:
```bash
grep -r "performSegue\|pushViewController\|present\|show" --include="*.swift"
```

**SwiftUI**:
```bash
grep -r "NavigationLink\|.sheet\|.fullScreenCover" --include="*.swift"
```

### Preferences Detection

```bash
grep -r "UserDefaults\|@AppStorage\|Settings.bundle" --include="*.swift" --include="*.plist"
```

### Missing Content Handling

If a section has no relevant implementation:
- Write: "无相关实现" (No relevant implementation)
- Keep section title (don't delete)
- Example: If no Core Data → "### 6.3 Persistence: 无相关实现"

### Path Format

All file paths relative to `ios_source_dir`:
- ✅ `Views/Main/MainViewController.swift`
- ❌ `/Users/xxx/MyApp/Views/Main/MainViewController.swift`

---

## Output Format

Both files use markdown with:
- Clear section headers (`###`)
- Tables for structured data
- Code blocks for examples
- Relative file paths

Write to:
- `{output_dir}/spec.md`
- `{output_dir}/design.md`

Return JSON:
```json
{
  "spec_path": "spec/ref/spec.md",
  "design_path": "spec/ref/design.md",
  "sections_written": {
    "spec": ["domain_glossary", "core_capabilities", "data_constraints", "ui_behavior", "preferences", "design_system"],
    "design": ["architecture", "modules", "api_interfaces", "data_models", "navigation", "state_management", "dependencies", "build_config"]
  },
  "files_analyzed": 127,
  "warnings": []
}
```
