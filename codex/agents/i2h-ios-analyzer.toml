### 6. State Management (状态管理)

Document state handling patterns:

**Output format**:

```markdown
### 6. State Management

#### ViewModels (Combine + ObservableObject)

```swift
class MainViewModel: ObservableObject {
    @Published var posts: [Post] = []
    @Published var isLoading: Bool = false
    @Published var errorMessage: String?
    
    func fetchPosts() {
        isLoading = true
        // Network call...
    }
}
```

**State flow**: ViewModel @Published → View subscribes → UI updates

#### Local State (UIViewController properties)

- `var posts: [Post] = []` — Data source for table view
- `var selectedPost: Post?` — Currently selected item
- `var isLoading: Bool = false` — Loading state

#### Shared State (Singleton / EnvironmentObject)

- `UserSession.shared` — Current logged-in user
- `@EnvironmentObject var appState: AppState` — Global app state (SwiftUI)

#### Persistence

- **UserDefaults**: User preferences (isDarkModeEnabled, fontSize)
- **Keychain**: Auth token, sensitive data
- **Core Data**: Posts, comments (if offline support)
```

