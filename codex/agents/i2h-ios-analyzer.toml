## design.md Structure (Implementation Design)

### 1. Architecture Overview (架构概览)

Identify architecture pattern:

**Detection logic**:
- **MVC**: UIViewController with outlets, no separate ViewModel
- **MVVM**: ViewModel classes conforming to ObservableObject
- **VIPER**: Interactor, Presenter, Router separation
- **SwiftUI**: View + ViewModel (ObservableObject) + Model

**Output format**:

```markdown
### 1. Architecture Overview

**Pattern**: MVVM (Model-View-ViewModel)

**Module Structure**:
```
MyApp/
├── Views/
│   ├── Main/
│   │   ├── MainViewController.swift
│   │   └── MainView.swift (SwiftUI)
│   └── Settings/
│       └── SettingsViewController.swift
├── ViewModels/
│   ├── MainViewModel.swift
│   └── UserViewModel.swift
├── Models/
│   ├── User.swift
│   ├── Post.swift
│   └── Comment.swift
├── Services/
│   ├── NetworkManager.swift
│   └── DatabaseManager.swift
└── Utilities/
    ├── Extensions/
    └── Helpers/
```

**Data Flow**: View ← ViewModel (@Published) ← Model
```

### 2. Module Responsibilities (模块职责)

For each major module, describe responsibilities:

**Output format**:

```markdown
### 2. Module Responsibilities

#### Views Layer
- **Responsibility**: UI rendering, user interaction handling
- **Key files**: MainViewController.swift, SettingsViewController.swift
- **Technologies**: UIKit, SwiftUI, Auto Layout

#### ViewModels Layer
- **Responsibility**: Business logic, data transformation, state management
- **Key files**: MainViewModel.swift, UserViewModel.swift
- **Technologies**: Combine, ObservableObject, @Published

#### Models Layer
- **Responsibility**: Data entities, domain logic
- **Key files**: User.swift, Post.swift, Comment.swift
- **Technologies**: Codable, Core Data (if used)

#### Services Layer
- **Responsibility**: Network requests, data persistence, external APIs
- **Key files**: NetworkManager.swift, DatabaseManager.swift
- **Technologies**: URLSession, Core Data / Realm, Keychain
```

### 3. API Interfaces (接口设计)

Extract network APIs, service protocols:

**Sources**:
- NetworkManager methods
- URLSession requests
- API endpoint constants
- Response models (Codable structs)

**Output format**:

```markdown
### 3. API Interfaces

#### User API

**Base URL**: `https://api.example.com/v1`

| Endpoint | Method | Parameters | Response | Description |
|----------|--------|------------|----------|-------------|
| `/users/signup` | POST | email, password, username | User | Register new user |
| `/users/signin` | POST | email, password | Token | Authenticate user |
| `/users/{id}` | GET | id | User | Get user profile |
| `/users/{id}` | PUT | id, User | User | Update user profile |

#### Post API

| Endpoint | Method | Parameters | Response | Description |
|----------|--------|------------|----------|-------------|
| `/posts` | GET | page, limit | [Post] | List posts (paginated) |
| `/posts` | POST | Post | Post | Create new post |
| `/posts/{id}` | GET | id | Post | Get post detail |
| `/posts/{id}` | PUT | id, Post | Post | Update post |
| `/posts/{id}` | DELETE | id | - | Delete post |
```

### 4. Data Models (数据模型)

Document entity structures:

**Output format**:

```markdown
### 4. Data Models

#### User

```swift
struct User: Codable, Identifiable {
    let id: UUID
    var email: String
    var username: String
    var avatarURL: URL?
    var createdAt: Date
    
    enum CodingKeys: String, CodingKey {
        case id, email, username
        case avatarURL = "avatar_url"
        case createdAt = "created_at"
    }
}
```

**Properties**:
- `id`: UUID, primary key, immutable
- `email`: String, unique, email format
- `username`: String, unique, 3-20 chars
- `avatarURL`: Optional URL, profile picture
- `createdAt`: Date, auto-generated

#### Post

```swift
struct Post: Codable, Identifiable {
    let id: UUID
    var title: String
    var content: String
    let authorId: UUID
    var status: PostStatus
    var publishedAt: Date?
    
    enum PostStatus: String, Codable {
        case draft, published, archived
    }
}
```

**Properties**:
- `id`: UUID, primary key
- `title`: String, max 200 chars
- `content`: String, max 5000 chars
- `authorId`: UUID, foreign key → User.id
- `status`: Enum, draft|published|archived
- `publishedAt`: Optional Date, set when published
```

